<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Gustavo Chiposche Pedro</title>
  <desc id="d">Full-stack Developer e AI Engineer — do Figma ao deploy</desc>

  <defs>
    <radialGradient id="glow" cx="85%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#00d2ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#00d2ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <path d="M18 18 H952 L982 48 V242 H66 L18 202 Z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="260" fill="#050505"/>
  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#grid)"/>
    <rect width="1000" height="260" fill="url(#glow)"/>
    <rect width="1000" height="260" fill="url(#glow2)"/>

    <!-- scan line -->
    <rect x="0" width="1000" height="60" fill="url(#scan)" opacity="0.5">
      <animate attributeName="y" values="-60;260" dur="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#00d2ff">
      <circle cx="120" cy="70" r="2.5" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="190" r="3" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="46" r="2" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="60" r="2" fill="#00ffff" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="210" r="2.5" fill="#8b5cf6" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="5.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="940" cy="90" r="1.8" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="140" r="1.8" fill="#00ffff" opacity="0.45">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0" dur="6.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name with glitch RGB split -->
    <g font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="46" letter-spacing="6" text-anchor="middle">
      <text x="500" y="126" fill="#ff0080" opacity="0.9">GUSTAVO CHIPOSCHE PEDRO
        <animate attributeName="x" values="500;496;503;499;500;500;494;500" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0;0;0.5;0;0.8;0" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="126" fill="#00ffff" opacity="0.9">GUSTAVO CHIPOSCHE PEDRO
        <animate attributeName="x" values="500;504;497;501;500;506;500;500" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.7;0;0.4;0;0;0.6" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="126" fill="#f0f0f5">GUSTAVO CHIPOSCHE PEDRO
        <animate attributeName="x" values="500;500;499;500;501;500;500;500" dur="2.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- subtitle + blinking cursor -->
    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="18" letter-spacing="2" text-anchor="middle">
      <text x="500" y="168" fill="#00d2ff">&#62; Full-stack Developer &#183; AI Engineer</text>
      <text x="790" y="168" fill="#00d2ff">_
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- tags -->
    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="12" letter-spacing="2" text-anchor="middle" fill="#8888a0">
      <text x="500" y="208">FIGMA / CÓDIGO / DEPLOY &#160;&#160;·&#160;&#160; BRASIL · PORTUGAL · ESPANHA</text>
    </g>
  </g>

  <!-- cyber frame border with pulsing stroke -->
  <path d="M18 18 H952 L982 48 V242 H66 L18 202 Z" fill="none" stroke="#00d2ff" stroke-width="1.5" filter="url(#soft)">
    <animate attributeName="stroke" values="#00d2ff;#00ffff;#00d2ff" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- corner accents -->
  <g stroke="#00ffff" stroke-width="2" fill="none">
    <path d="M18 60 V202 L66 242"/>
    <path d="M982 200 V48 L952 18"/>
  </g>
</svg>
